{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card border-0 shadow-lg" style="width: 100%; max-width: 400px; border-radius: 1rem;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                    <i class="bi bi-shield-check" style="font-size: 1.5rem;"></i>
                </div>
                <h3 class="fw-bold text-dark">Enter Reset Code</h3>
                <p class="text-muted">We sent a 6-digit code to <strong>{{ email }}</strong></p>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="email" value="{{ email }}">
                <div class="form-floating mb-4">
                    <input type="text" name="otp" class="form-control" id="otpInput" placeholder="6-digit code"
                           inputmode="numeric" pattern="[0-9]*" maxlength="6" required autofocus>
                    <label for="otpInput">6-digit code</label>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" style="border-radius: 0.5rem;">Verify Code</button>
                <div class="text-center">
                    <a href="{{ url_for('auth.forgot_password') }}" class="text-decoration-none text-muted small">Didn't get a code? Send again</a>
                </div>
            </form>
        </div>
    </div>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
{% endblock %}
