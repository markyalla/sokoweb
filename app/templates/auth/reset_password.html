{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card border-0 shadow-lg" style="width: 100%; max-width: 400px; border-radius: 1rem;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                    <i class="bi bi-key" style="font-size: 1.5rem;"></i>
                </div>
                <h3 class="fw-bold text-dark">Create New Password</h3>
                <p class="text-muted">Choose a new password for {{ email }}</p>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="email" value="{{ email }}">
                <div class="form-floating mb-3">
                    <input type="password" name="new_password" class="form-control" id="newPwInput" placeholder="New password" minlength="8" required autofocus>
                    <label for="newPwInput">New password</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" name="confirm_password" class="form-control" id="confirmPwInput" placeholder="Confirm new password" minlength="8" required>
                    <label for="confirmPwInput">Confirm new password</label>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100" style="border-radius: 0.5rem;">Reset Password</button>
            </form>
        </div>
    </div>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
{% endblock %}
